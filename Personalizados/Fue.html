<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Color de la barra de navegación en Chrome/móviles -->
  <meta name="theme-color" content="#00ff41">
  <meta name="description" content="Error 404 - De BerMatCode">
  <title>404 | De BerMatCode</title>
  <style>
    :root {
      --matrix: #00ff41;
      --matrix-dim: #008f11;
      --bg: #050505;
      --text: #e0e0e0;
      --glass: rgba(8, 12, 8, 0.85);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Canvas Matrix */
    #matrix {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
      opacity: 0.22;
    }

    /* Efecto Scanlines CRT */
    .scanlines {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.15) 0px,
        rgba(0, 0, 0, 0.15) 1px,
        transparent 1px,
        transparent 2px
      );
      pointer-events: none;
      z-index: 2;
      opacity: 0.6;
    }

    /* Contenedor principal */
    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 3rem 2.5rem;
      background: var(--glass);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 255, 65, 0.2);
      border-radius: 16px;
      max-width: 540px;
      width: 90%;
      box-shadow: 0 0 30px rgba(0, 255, 65, 0.05);
      animation: float 6s ease-in-out infinite, borderPulse 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    @keyframes borderPulse {
      0%, 100% { box-shadow: 0 0 20px rgba(0, 255, 65, 0.05); border-color: rgba(0, 255, 65, 0.2); }
      50% { box-shadow: 0 0 35px rgba(0, 255, 65, 0.15); border-color: rgba(0, 255, 65, 0.4); }
    }

    /* Glitch 404 */
    .glitch {
      font-size: clamp(5rem, 14vw, 9.5rem);
      font-weight: 900;
      color: var(--matrix);
      position: relative;
      text-shadow: 0 0 15px rgba(0, 255, 65, 0.7);
      letter-spacing: -4px;
      line-height: 1;
      margin-bottom: 0.5rem;
    }

    .glitch::before, .glitch::after {
      content: attr(data-text);
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
    }

    .glitch::before {
      color: #ff00ff;
      animation: glitch-1 2s infinite linear alternate-reverse;
      clip-path: polygon(0 0, 100% 0, 100% 33%, 0 33%);
    }

    .glitch::after {
      color: #00ffff;
      animation: glitch-2 3s infinite linear alternate-reverse;
      clip-path: polygon(0 67%, 100% 67%, 100% 100%, 0 100%);
    }

    @keyframes glitch-1 {
      0% { transform: translate(0); }
      20% { transform: translate(-3px, 2px); }
      40% { transform: translate(3px, -1px); }
      60% { transform: translate(-2px, -2px); }
      80% { transform: translate(2px, 3px); }
      100% { transform: translate(0); }
    }

    @keyframes glitch-2 {
      0% { transform: translate(0); }
      20% { transform: translate(3px, -2px); }
      40% { transform: translate(-2px, 1px); }
      60% { transform: translate(2px, 2px); }
      80% { transform: translate(-3px, -1px); }
      100% { transform: translate(0); }
    }

    h2 {
      font-size: 1.5rem;
      font-weight: 500;
      margin-bottom: 1.2rem;
      color: #fff;
      opacity: 0;
      animation: fadeIn 0.8s ease-out 0.5s forwards;
    }

    /* Typewriter con cursor */
    .typewriter {
      font-size: 1rem;
      line-height: 1.7;
      color: #a0a0a0;
      min-height: 3.4em;
      margin-bottom: 0.5rem;
      opacity: 0;
      animation: fadeIn 0.5s ease-out 1s forwards;
    }
    .cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      background: var(--matrix);
      margin-left: 2px;
      vertical-align: text-bottom;
      animation: blink 1s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    footer {
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: #555;
      border-top: 1px solid rgba(255,255,255,0.05);
      padding-top: 1rem;
      opacity: 0;
      animation: fadeIn 0.8s ease-out 1.2s forwards;
    }
    .brand { color: var(--matrix); font-weight: 600; letter-spacing: 0.5px; }

    @keyframes fadeIn { to { opacity: 1; } }

    /* Responsive */
    @media (max-width: 480px) {
      .container { padding: 2rem 1.5rem; }
      .glitch { font-size: 5.5rem; letter-spacing: -2px; }
      h2 { font-size: 1.2rem; }
      .typewriter { font-size: 0.95rem; min-height: 4em; }
    }
  </style>
</head>
<body>
  <canvas id="matrix"></canvas>
  <div class="scanlines"></div>
  
  <main class="container" role="main">
    <div class="glitch-wrapper">
      <h1 class="glitch" data-text="404">404</h1>
    </div>
    <h2>Página no encontrada</h2>
    <p class="typewriter" id="typewriter"></p>
    <footer>
      © <span id="year"></span> <span class="brand">De BerMatCode</span> | Sistema seguro
    </footer>
  </main>

  <script>
    // Año dinámico
    document.getElementById('year').textContent = new Date().getFullYear();

    // Efecto Typewriter
    (function() {
      const text = "El recurso solicitado ha sido eliminado o nunca existió en nuestro servidor. Verifique la ruta de acceso o contacte al administrador del sistema.";
      const el = document.getElementById('typewriter');
      let i = 0;
      function type() {
        if (i < text.length) {
          el.innerHTML = text.substring(0, i + 1) + '<span class="cursor"></span>';
          i++;
          setTimeout(type, 35 + Math.random() * 25); // Velocidad variable para realismo
        } else {
          // Dejar el cursor parpadeando al final
          el.innerHTML = text + '<span class="cursor"></span>';
        }
      }
      setTimeout(type, 1200);
    })();

    // Matrix con caracteres chinos
    (function() {
      const canvas = document.getElementById('matrix');
      const ctx = canvas.getContext('2d');
      const fontSize = 15;
      // Caracteres chinos densos y variados
      const chars = '的一了是我不在人们有来他这上着个地到大里说就去子得也和那要下看天时过出小么起你都把好还多可发能做着会开而还些又生学也于之方多经进少系统代码运行数据流网络协议加密解密节点同步验证通过权限拒绝访问错误日志';
      let drops = [];

      function init() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const cols = Math.floor(canvas.width / fontSize);
        drops = Array(cols).fill(0);
      }

      function draw() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.06)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.font = `${fontSize}px "Microsoft YaHei", "PingFang SC", monospace`;
        ctx.fillStyle = '#00ff41';

        for (let i = 0; i < drops.length; i++) {
          const text = chars[Math.floor(Math.random() * chars.length)];
          // Algunas columnas más brillantes (efecto lluvia Matrix real)
          ctx.fillStyle = Math.random() > 0.95 ? '#ffffff' : '#00ff41';
          ctx.fillText(text, i * fontSize, drops[i] * fontSize);

          if (drops[i] * fontSize > canvas.height && Math.random() > 0.98) {
            drops[i] = 0;
          }
          drops[i] += Math.random() > 0.9 ? 2 : 1;
        }
        requestAnimationFrame(draw);
      }

      window.addEventListener('resize', init);
      init();
      requestAnimationFrame(draw);
    })();
  </script>
</body>
</html>
